name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Create build directory
      run: mkdir -p build

    - name: Build DSA components
      run: make dsa-core

    - name: Build systems
      run: make systems

    - name: Run tests
      run: make test